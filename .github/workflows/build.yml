name: Windows source build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Build and run source tests
        shell: pwsh
        run: .\build.ps1 -SourceOnly -PythonExecutable (Get-Command python).Source
      - name: Check upload contents
        shell: pwsh
        run: python tools/prepare-github.py --check-only
